name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: fake
      GROQ_API_KEY: fake
      DATABASE_URL: postgresql://fake:fake@localhost/fake
      MONGODB_URI: mongodb://localhost:27017
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest httpx ruff
      - run: ruff check app --select E9,F63,F7,F82
      - run: python -m pytest -q
      
  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Verificar app publicada
        run: |
          sleep 60
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "${{ secrets.APP_URL }}/health" --max-time 30